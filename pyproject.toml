[project]
name = "study-agent"
version = "0.4.0"
description = "A source-grounded learning assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "chromadb>=1,<2",
  "httpx>=0.27,<1",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "openpyxl>=3.1,<4",
  "openai>=1,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
